[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hippo-auth"
version = "0.1.0"
description = "Ed25519 + RFC 9421 HTTP Message Signatures for A2A"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
resolver = ["httpx>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]
